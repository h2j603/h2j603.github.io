<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overflow: auto</title>
<style>
* {
  margin: 0;
  box-sizing: border-box;
}

body {
  padding: 16px;
  font: 16px/1.4 Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color: #000;
  background: #fff;
}

main {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 32px 16px;
}

@media (min-width: 720px) {
  main {
    grid-template-columns: repeat(3, 1fr);
    max-width: 960px;
  }
}

figcaption {
  margin-bottom: 6px;
  font: 12px/1.3 ui-monospace, monospace;
}

.box {
  height: 240px;
  overflow: auto;
  border: 1px solid #000;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  height: 80px;
  padding: 8px;
  border-bottom: 1px solid #000;
  background: #fff;
  font-variant-numeric: tabular-nums;
}

.row:last-child {
  border-bottom: 0;
}

.row a {
  color: inherit;
  text-decoration: none;
}

/* 상자마다 하나씩 */
.snap-mandatory { scroll-snap-type: y mandatory; }
.snap-mandatory .row { scroll-snap-align: start; }

.snap-proximity { scroll-snap-type: y proximity; }
.snap-proximity .row { scroll-snap-align: start; }

.smooth { scroll-behavior: smooth; }

.contain { overscroll-behavior: contain; }

.hidden { overflow: hidden; }

.no-bar { scrollbar-width: none; }
.no-bar::-webkit-scrollbar { display: none; }

.sticky .row:first-child {
  position: sticky;
  top: 0;
}

@keyframes fade {
  from, to { opacity: .1; }
  50% { opacity: 1; }
}

.timeline .row {
  animation: fade linear both;
  animation-timeline: view();
}
</style>
</head>
<body>
<main>
  <figure><figcaption>auto</figcaption><div class="box"></div></figure>
  <figure><figcaption>snap mandatory</figcaption><div class="box snap-mandatory"></div></figure>
  <figure><figcaption>snap proximity</figcaption><div class="box snap-proximity"></div></figure>
  <figure><figcaption>smooth</figcaption><div class="box smooth"></div></figure>
  <figure><figcaption>overscroll contain</figcaption><div class="box contain"></div></figure>
  <figure><figcaption>hidden</figcaption><div class="box hidden"></div></figure>
  <figure><figcaption>scrollbar none</figcaption><div class="box no-bar"></div></figure>
  <figure><figcaption>sticky</figcaption><div class="box sticky"></div></figure>
  <figure><figcaption>view()</figcaption><div class="box timeline"></div></figure>
</main>
<script>
document.querySelectorAll('.box').forEach((box, i) => {
  const top = 'top-' + i;
  for (let n = 1; n <= 12; n++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.textContent = String(n).padStart(2, '0');
    if (n === 1) row.id = top;
    if (n === 12) {
      const a = document.createElement('a');
      a.href = '#' + top;
      a.textContent = '↑';
      row.append(a);
    }
    box.append(row);
  }
});
</script>
</body>
</html>
