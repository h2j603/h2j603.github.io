<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overflow: auto</title>
<style>
* {
  margin: 0;
  box-sizing: border-box;
}

body {
  padding: 16px;
  font: 16px/1.4 Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color: #000;
  background: #fff;
}

main {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 32px 16px;
}

@media (min-width: 720px) {
  main {
    grid-template-columns: repeat(3, 1fr);
    max-width: 960px;
  }
}

figure {
  display: grid;
  grid-row: span 2;
  grid-template-rows: subgrid;
  row-gap: 6px;
}

summary {
  list-style: none;
  cursor: pointer;
  font: 12px/1.3 ui-monospace, monospace;
}

summary::-webkit-details-marker {
  display: none;
}

summary::after {
  content: " +";
}

details[open] summary::after {
  content: " −";
}

pre {
  margin-top: 6px;
  font: 12px/1.5 ui-monospace, monospace;
  white-space: pre-wrap;
}

details p {
  margin-top: 4px;
  font-size: 13px;
  line-height: 1.6;
  word-break: keep-all;
}

.box {
  height: 240px;
  overflow: auto;
  border: 1px solid #000;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  height: 80px;
  padding: 8px;
  border-bottom: 1px solid #000;
  background: #fff;
  font-variant-numeric: tabular-nums;
}

.row:last-child {
  border-bottom: 0;
}

.row a {
  color: inherit;
  text-decoration: none;
}

.snap-mandatory { scroll-snap-type: y mandatory; }
.snap-mandatory .row { scroll-snap-align: start; }

.snap-proximity { scroll-snap-type: y proximity; }
.snap-proximity .row { scroll-snap-align: start; }

.smooth { scroll-behavior: smooth; }

.overscroll-contain { overscroll-behavior: contain; }

.hidden { overflow: hidden; }

.scrollbar-none { scrollbar-width: none; }
.scrollbar-none::-webkit-scrollbar { display: none; }

.sticky .row:first-child {
  position: sticky;
  top: 0;
}

@keyframes fade {
  from, to { opacity: .1; }
  50% { opacity: 1; }
}

.view .row {
  animation: fade linear both;
  animation-timeline: view();
}
</style>
</head>
<body>
<main>
  <figure>
    <details><summary>auto</summary><pre>overflow: auto;</pre><p>내용이 넘칠 때만 스크롤할 수 있다.</p></details>
    <div class="box"></div>
  </figure>
  <figure>
    <details><summary>snap mandatory</summary><pre>scroll-snap-type: y mandatory;
.row { scroll-snap-align: start; }</pre><p>스크롤이 멈추면 항상 줄의 시작에 맞춰 정렬된다.</p></details>
    <div class="box snap-mandatory"></div>
  </figure>
  <figure>
    <details><summary>snap proximity</summary><pre>scroll-snap-type: y proximity;
.row { scroll-snap-align: start; }</pre><p>스크롤이 줄의 시작 근처에서 멈출 때만 정렬된다.</p></details>
    <div class="box snap-proximity"></div>
  </figure>
  <figure>
    <details><summary>smooth</summary><pre>scroll-behavior: smooth;</pre><p>↑ 링크 같은 이동에 애니메이션이 붙는다. 손으로 하는 스크롤은 바뀌지 않는다.</p></details>
    <div class="box smooth"></div>
  </figure>
  <figure>
    <details><summary>overscroll contain</summary><pre>overscroll-behavior: contain;</pre><p>상자 끝에 닿아도 스크롤이 페이지로 이어지지 않는다.</p></details>
    <div class="box overscroll-contain"></div>
  </figure>
  <figure>
    <details><summary>hidden</summary><pre>overflow: hidden;</pre><p>손으로는 스크롤할 수 없지만 링크로는 이동한다. 스크롤 컨테이너이기 때문이다.</p></details>
    <div class="box hidden"></div>
  </figure>
  <figure>
    <details><summary>scrollbar none</summary><pre>scrollbar-width: none;</pre><p>스크롤바를 숨긴다. 스크롤은 그대로 된다.</p></details>
    <div class="box scrollbar-none"></div>
  </figure>
  <figure>
    <details><summary>sticky</summary><pre>.row:first-child {
  position: sticky;
  top: 0;
}</pre><p>첫 줄이 스크롤되어도 상자 위쪽에 고정된다.</p></details>
    <div class="box sticky"></div>
  </figure>
  <figure>
    <details><summary>view()</summary><pre>@keyframes fade {
  from, to { opacity: .1; }
  50% { opacity: 1; }
}
.row {
  animation: fade linear both;
  animation-timeline: view();
}</pre><p>애니메이션 진행을 시간 대신 줄의 위치로 정한다.</p></details>
    <div class="box view"></div>
  </figure>
</main>
<script>
document.querySelectorAll('.box').forEach((box, i) => {
  const top = 'top-' + i;
  for (let n = 1; n <= 12; n++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.textContent = String(n).padStart(2, '0');
    if (n === 1) row.id = top;
    if (n === 1 && box.classList.contains('hidden')) {
      const a = document.createElement('a');
      a.href = '#bottom-' + i;
      a.textContent = '↓ 12';
      row.append(a);
    }
    if (n === 12) {
      row.id = 'bottom-' + i;
      const a = document.createElement('a');
      a.href = '#' + top;
      a.textContent = '↑';
      row.append(a);
    }
    box.append(row);
  }
});
</script>
</body>
</html>
