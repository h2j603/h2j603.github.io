<!doctype html>
<html lang="en">
<head>

<title>random box</title>
<style>
@font-face {
  font-family: "Suisse Intl Condensed";

body { margin: 0; padding: 1rem; }
#text { font-size: 16px; position: relative; }
#text .line { white-space: pre; }
#text .c { display: inline-block; }
#text .line { transform-origin: center; }

/* 모양 모드: 줄 조각(run)을 실루엣 안의 정확한 위치·폭에 절대배치, 글자를 양끝으로 고르게 벌린다 */
#text.shape .line { position: absolute; display: flex; justify-content: space-between; }
#text.shape .line.narrow { justify-content: center; }
#text.shape .line.g { font-weight: 700; color: var(--g); }   /* 초록 채널: 줄 단위 볼드(검정) */
#text.shape .c.b { color: var(--b); font-weight: 700; }      /* 파랑 채널: 글자 단위 lawngreen */

/* 버튼: 화면 중앙 하단 고정 */
#fun {
  position: fixed;
  left: 50%;
  bottom: 1rem;
  translate: -50% 0;
  z-index: 100;
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  text-transform: uppercase;
  color: #000;
  background: lawngreen;
  border: 0;
  border-radius: 999px;
  padding: 0.6em 1.4em;
  margin: 0;
  cursor: pointer;
  box-shadow: 0 0 0 0 rgba(124, 252, 0, 0);
  transition: box-shadow 0.35s ease, transform 0.12s ease, filter 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
#fun:hover {
  transform: scale(1.06);
  box-shadow: 0 0 24px 6px rgba(124, 252, 0, 0.75), 0 0 64px 20px rgba(124, 252, 0, 0.35);
}
#fun:active {
  transform: scale(0.95);
  filter: brightness(0.9);
  box-shadow: 0 0 12px 2px rgba(124, 252, 0, 0.6);
}
#fun:focus-visible {
  outline: 2px solid #000;
  outline-offset: 3px;
}
/* 켜짐: 글로우가 더 넓고 진하게 퍼진다 */
#fun[aria-pressed="true"] {

}
#fun[aria-pressed="true"]:hover {

}

function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

const container = document.getElementById('text');
const fun = document.getElementById('fun');
let lorem = [];
let on = false;
let theme = null;

function lineEl(text, lh = LINE_HEIGHT) {
  const el = document.createElement('div');
  el.className = 'line';
  el.style.height = lh + 'px';
  el.style.lineHeight = lh + 'px';
  for (const ch of text) {
    const s = document.createElement('span');
    s.className = 'c';
    s.textContent = ch;
    el.appendChild(s);
  }
  return el;
}

// 로렘 입숨: 왼끝맞춤 문단
function renderLorem() {
  const width = container.clientWidth;
  container.className = '';
  container.textContent = '';
  container.style.cssText = '';
  lorem.forEach((p, i) => {
    const { lines } = layoutWithLines(p, width, LINE_HEIGHT);
    for (const line of lines) container.appendChild(lineEl(line.text));
    if (i < lorem.length - 1) container.appendChild(lineEl(''));
  });
}

// 한 줄 높이의 띠(y0~y1)에서 채워진 x 구간들을 찾는다.
// 글자의 몸통이 놓이는 띠 가운데 40% 행만 본다 — 비스듬한 가장자리에서 줄이 조각나지 않게
function runsInBand(img, y0, y1) {
  const { width: W, data } = img;
  const rows = [];
  const lh = y1 - y0;
  for (let y = Math.round(y0 + lh * 0.3); y <= y0 + lh * 0.7; y += 2) rows.push(y);
  const runs = [];
  let start = -1, g = 0;
  for (let x = 0; x <= W; x++) {
    let filled = x < W, isG = false;
    if (filled) {
      for (const y of rows) {
        const i = (y * W + x) * 4;
        if (data[i + 3] < 128) { filled = false; break; }
        if (data[i + 1] > 128) isG = true;
      }
    }
    if (filled) { if (start < 0) { start = x; g = 0; } if (isG) g++; }
    else if (start >= 0) { runs.push({ x: start, w: x - start, g: g > (x - start) / 2 }); start = -1; }
  }
  return runs;
}

// 모양 입숨: 실루엣 픽셀을 훑어 줄마다 정확한 구간에 텍스트를 채운다
const preparedCache = new Map();
function preparedFor(t, size, bold) {
  const key = t.name + size + (bold ? 'b' : '');
  if (!preparedCache.has(key)) preparedCache.set(key, prepareWithSegments(t.text.repeat(2), `${bold ? 'bold ' : ''}${size}px "Suisse Intl Condensed"`));
  return preparedCache.get(key);
}

function renderShape(t) {
  const width = container.clientWidth;
  const W = Math.ceil(Math.min(width, (innerHeight - BUTTON_ZONE) * t.aspect));
  const H = Math.ceil(W / t.aspect);
  const size = Math.round(Math.min(SHAPE_FONT.max, Math.max(SHAPE_FONT.min, Math.min(W, H) * SHAPE_FONT.per)));
  const lh = Math.round(size * 1.35);
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  t.draw(ctx, W, H);
  const img = ctx.getImageData(0, 0, W, H);
  const left = (width - W) / 2;
  const src = preparedFor(t, size, false), srcBold = preparedFor(t, size, true);
  container.className = 'shape';
  container.textContent = '';
  container.style.cssText = `height:${H}px;font-size:${size}px;color:${t.body};--g:${t.g};--b:${t.b}`;
  let cursor = { segmentIndex: 0, graphemeIndex: 0 };
  const placed = [];
  for (let y = 0; y + lh <= H; y += lh) {
    for (const run of runsInBand(img, y, y + lh)) {
      if (run.w < MIN_RUN * size) continue;
      const p = run.g ? srcBold : src;
      let line = layoutNextLine(p, cursor, run.w);
      if (!line) { cursor = { segmentIndex: 0, graphemeIndex: 0 }; line = layoutNextLine(p, cursor, run.w); }
      cursor = line.end;
      const text = line.text.trim();
      if (!text) continue;
      const el = lineEl(text, lh);
      el.style.left = (left + run.x) + 'px';
      el.style.top = y + 'px';
      el.style.width = run.w + 'px';
      if (run.g) el.classList.add('g');
      if (el.childElementCount < 6) el.classList.add('narrow');
      container.appendChild(el);
      placed.push({ el, x: run.x, y: y + lh / 2 });
    }
  }
  // 파랑 채널: 글자 중심이 파랑 영역에 놓이면 색을 바꾼다.
  // 위치 읽기(offsetLeft)와 클래스 쓰기를 섞으면 글자마다 레이아웃을 다시 계산하므로, 읽기를 다 마친 뒤 한 번에 쓴다
  const marks = [];
  for (const { el, x, y } of placed) {
    for (const c of el.children) {
      const px = Math.round(x + c.offsetLeft + c.offsetWidth / 2), py = Math.round(y);
      if (px < 0 || px >= W) continue;
      const i = (py * W + px) * 4;
      if (img.data[i + 2] > 128 && img.data[i + 1] < 128) marks.push(c);
    }
  }
  for (const c of marks) c.classList.add('b');
}

// 애니메이션은 줄 단위로 건다 — 글자 단위(2천 개)는 폰에서 렉이 걸린다
function lines() { return [...container.querySelectorAll('.line')]; }

// 현재 줄들을 흩어지듯 지우고, 끝나면 next()를 실행
function fadeOut(next) {
  for (const c of lines()) {
    const delay = Math.random() * (SWAP.out - 150);
    c.style.transition = `transform 150ms ease-in ${delay}ms, opacity 150ms ease-in ${delay}ms`;
    c.style.transform = 'scale(0)';
    c.style.opacity = '0';
  }
  setTimeout(next, SWAP.out);
}

// 새 줄들을 화면 중심에서 바깥 순서로 튀어나오게
function growIn() {
  const cs = lines();
  const cx = innerWidth / 2, cy = innerHeight / 2;
  let maxDist = 1;
  const d = cs.map(c => {
    const r = c.getBoundingClientRect();
    const dist = Math.hypot(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy);
    if (dist > maxDist) maxDist = dist;
    return dist;
  });
  cs.forEach(c => { c.style.transition = 'none'; c.style.transform = 'scale(0)'; c.style.opacity = '0'; });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    cs.forEach((c, i) => {
      const delay = (d[i] / maxDist) * SWAP.grow;
      c.style.transition = `transform 250ms cubic-bezier(0.34, 1.56, 0.64, 1) ${delay}ms, opacity 150ms ease-out ${delay}ms`;
      c.style.transform = 'none';
      c.style.opacity = '1';
    });
  }));
}

// 직전과 다른 테마를 무작위로 고른다
function pickTheme() {
  const forced = THEMES.find(t => t.name === new URLSearchParams(location.search).get('theme'));
  if (forced) return forced;   // ?theme=cat 처럼 URL로 고정 (확인용)
  const pool = THEMES.filter(t => t !== theme);
  return pool[Math.floor(Math.random() * pool.length)];
}

const render = () => on ? renderShape(theme) : renderLorem();

fun.addEventListener('click', () => {
  on = !on;
  if (on) theme = pickTheme();
  fun.setAttribute('aria-pressed', String(on));
  fadeOut(() => { render(); growIn(); });
});

await Promise.all([document.fonts.load(FONT), document.fonts.load(FONT_BOLD)]);
lorem = LOREM.map(t => prepareWithSegments(t, FONT));
renderLorem();
let t, lastW = innerWidth;
addEventListener('resize', () => {
  if (innerWidth === lastW) return;   // iOS 주소창 접힘(세로만 변함)은 무시
  lastW = innerWidth;
  clearTimeout(t); t = setTimeout(render, 150);
});
</script>
