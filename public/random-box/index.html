<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>random box</title>
<style>
@font-face {
  font-family: "Suisse Intl Condensed";
  src: url("fonts/SuisseIntlCond-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Suisse Intl Condensed";
  src: url("fonts/SuisseIntlCond-Bold.woff2") format("woff2");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
html { font-family: "Suisse Intl Condensed", sans-serif; -webkit-text-size-adjust: 100%; }
body { margin: 0; padding: 1rem; }
#text { font-size: 16px; position: relative; }
#text .line { white-space: pre; }
#text .c { display: inline-block; will-change: transform, opacity; }

/* 피자 모드: 줄 조각(run)을 모양 안의 정확한 위치·폭에 절대배치, 글자를 양끝으로 고르게 벌린다 */
#text.pizza .line { position: absolute; display: flex; justify-content: space-between; }
#text.pizza .line.narrow { justify-content: center; }
#text.pizza .line.crust { font-weight: 700; color: #b5702c; }
#text.pizza .c.pep { color: #d2331f; font-weight: 700; }

/* 버튼: 화면 중앙 하단 고정 */
#fun {
  position: fixed;
  left: 50%;
  bottom: 1rem;
  translate: -50% 0;
  z-index: 100;
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  text-transform: uppercase;
  color: #000;
  background: lawngreen;
  border: 0;
  border-radius: 999px;
  padding: 0.6em 1.4em;
  margin: 0;
  cursor: pointer;
  box-shadow: 0 0 0 0 rgba(124, 252, 0, 0);
  transition: box-shadow 0.35s ease, transform 0.12s ease, filter 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
#fun:hover {
  box-shadow: 0 0 24px 6px rgba(124, 252, 0, 0.75), 0 0 64px 20px rgba(124, 252, 0, 0.35);
}
#fun:active {
  transform: scale(0.95);
  filter: brightness(0.9);
  box-shadow: 0 0 12px 2px rgba(124, 252, 0, 0.6);
}
#fun:focus-visible {
  outline: 2px solid #000;
  outline-offset: 3px;
}
#fun[aria-pressed="true"] {
  background: #000;
  color: lawngreen;
  box-shadow: 0 0 24px 6px rgba(124, 252, 0, 0.75);
}
</style>
</head>
<body>
<div id="text"></div>
<button id="fun" type="button" aria-pressed="false">fun mode!</button>

<script type="module">
import { prepareWithSegments, layoutWithLines, layoutNextLine } from './lib/pretext.js';

const FONT_SIZE = 16;
const LINE_HEIGHT = 22;
const FONT = `${FONT_SIZE}px "Suisse Intl Condensed"`;
const FONT_BOLD = `bold ${FONT_SIZE}px "Suisse Intl Condensed"`;
const BUTTON_ZONE = 120;   // 조각 높이를 정할 때 버튼 자리로 비워둘 높이(px)
const MIN_RUN = 2;         // 이보다 좁은 구간(글자 폭 배수)엔 글자를 넣지 않는다
const PIZZA_FONT = { min: 10, max: 16, perR: 1 / 34 };  // 글자 크기 = R/34, 10~16px 사이
const SWAP = { out: 350, grow: 700 };  // 전환 애니메이션(ms)

// 조각 모양 (모두 반지름 R에 대한 비율)
const SLICE = {
  angle: Math.PI / 3,      // 60° — 피자 1/6 조각
  crust: 0.11,             // 크러스트 띠 두께 (볼드 텍스트로 채움)
  pepperoni: 0.075,        // 페퍼로니 반지름 (그 자리 글자가 빨갛게 된다)
  // 페퍼로니 위치: 꼭짓점에서의 거리 r(0~1), 중심축 기준 각도(°, 좌−/우+)
  toppings: [ [0.30, 4], [0.48, -13], [0.52, 13], [0.68, 0], [0.80, -15], [0.81, 16] ],
};

const LOREM = [
  'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.',
  'Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo. Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt. Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit, sed quia non numquam eius modi tempora incidunt ut labore et dolore magnam aliquam quaerat voluptatem.',
  'At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident, similique sunt in culpa qui officia deserunt mollitia animi, id est laborum et dolorum fuga. Et harum quidem rerum facilis est et expedita distinctio. Nam libero tempore, cum soluta nobis est eligendi optio cumque nihil impedit quo minus id quod maxime placeat facere possimus, omnis voluptas assumenda est, omnis dolor repellendus.',
];

const PIZZA = 'Pizza ipsum dolor amet. Pepperoni mozzarella marinara, thin crust hand-tossed and wood-fired. Extra cheese, garlic parmesan, ranch on the side. Meatball buffalo chicken, bacon ricotta, pineapple ham (yes, pineapple). Deep dish stuffed crust, sausage and onions, roasted red peppers, black olives, banana peppers. Fresh basil, burrata, San Marzano tomatoes, olive oil drizzle. Slice by the slice, whole pie, family size, large with everything. Pesto white pie, spinach mushroom, four cheese, buffalo mozzarella. Crispy edges, bubbly cheese, chewy crust, charred bottom. NY style fold, Detroit square, Neapolitan blister, Sicilian thick. Delivery in thirty minutes, dine in, carry out, late night slice. Anchovies for the brave, jalapenos for the bold, extra sauce for the wise. ';

const container = document.getElementById('text');
const fun = document.getElementById('fun');
let lorem = [];
let on = false;

function lineEl(text, lh = LINE_HEIGHT) {
  const el = document.createElement('div');
  el.className = 'line';
  el.style.height = lh + 'px';
  el.style.lineHeight = lh + 'px';
  for (const ch of text) {
    const s = document.createElement('span');
    s.className = 'c';
    s.textContent = ch;
    el.appendChild(s);
  }
  return el;
}

// 로렘 입숨: 왼끝맞춤 문단
function renderLorem() {
  const width = container.clientWidth;
  container.className = '';
  container.textContent = '';
  container.style.height = '';
  container.style.fontSize = '';
  lorem.forEach((p, i) => {
    const { lines } = layoutWithLines(p, width, LINE_HEIGHT);
    for (const line of lines) container.appendChild(lineEl(line.text));
    if (i < lorem.length - 1) container.appendChild(lineEl(''));
  });
}

// 조각 실루엣을 캔버스에 그린다. 빨강 채널 = 속(body), 초록 채널 = 크러스트, 파랑 채널 = 페퍼로니.
function drawSlice(W, H, R) {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const tipX = W / 2, tipY = H;
  const a0 = -Math.PI / 2 - SLICE.angle / 2, a1 = -Math.PI / 2 + SLICE.angle / 2;
  // 속: 꼭짓점에서 크러스트 안쪽 호까지의 부채꼴
  ctx.fillStyle = '#f00';
  ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.arc(tipX, tipY, R * (1 - SLICE.crust), a0, a1); ctx.closePath(); ctx.fill();
  // 크러스트: 바깥 호와 안쪽 호 사이의 띠
  ctx.fillStyle = '#0f0';
  ctx.beginPath(); ctx.arc(tipX, tipY, R, a0, a1); ctx.arc(tipX, tipY, R * (1 - SLICE.crust), a1, a0, true); ctx.closePath(); ctx.fill();
  // 페퍼로니: 파랑 채널 (속 위에 덮어 그린다)
  ctx.fillStyle = '#00f';
  for (const [r, deg] of SLICE.toppings) {
    const a = -Math.PI / 2 + deg * Math.PI / 180;
    ctx.beginPath(); ctx.arc(tipX + Math.cos(a) * r * R, tipY + Math.sin(a) * r * R, SLICE.pepperoni * R, 0, Math.PI * 2); ctx.fill();
  }
  return ctx.getImageData(0, 0, W, H);
}

// 한 줄 높이의 띠(y0~y1) 안에서, 모든 행에 걸쳐 채워진 x 구간들을 찾는다
function runsInBand(img, y0, y1) {
  const { width: W, data } = img;
  const rows = [];
  for (let y = y0 + 1; y < y1 - 1; y += 2) rows.push(y);
  const runs = [];
  let start = -1, crust = 0;
  for (let x = 0; x <= W; x++) {
    let filled = x < W, isCrust = false;
    if (filled) {
      for (const y of rows) {
        const i = (y * W + x) * 4;
        if (data[i + 3] < 128) { filled = false; break; }
        if (data[i + 1] > 128) isCrust = true;
      }
    }
    if (filled) { if (start < 0) { start = x; crust = 0; } if (isCrust) crust++; }
    else if (start >= 0) { runs.push({ x: start, w: x - start, crust: crust > (x - start) / 2 }); start = -1; }
  }
  return runs;
}

// 피자 입숨: 실루엣 픽셀을 훑어 줄마다 정확한 구간에 텍스트를 채운다
const preparedCache = new Map();
function preparedFor(size, bold) {
  const key = size + (bold ? 'b' : '');
  if (!preparedCache.has(key)) preparedCache.set(key, prepareWithSegments(PIZZA.repeat(12), `${bold ? 'bold ' : ''}${size}px "Suisse Intl Condensed"`));
  return preparedCache.get(key);
}

function renderPizza() {
  const width = container.clientWidth;
  const R = Math.min(width / (2 * Math.sin(SLICE.angle / 2)), innerHeight - BUTTON_ZONE);
  const size = Math.round(Math.min(PIZZA_FONT.max, Math.max(PIZZA_FONT.min, R * PIZZA_FONT.perR)));
  const lh = Math.round(size * 1.35);
  const W = Math.ceil(2 * R * Math.sin(SLICE.angle / 2)), H = Math.ceil(R);
  const img = drawSlice(W, H, R);
  const left = (width - W) / 2;
  const src = preparedFor(size, false), srcBold = preparedFor(size, true);
  container.className = 'pizza';
  container.textContent = '';
  container.style.height = H + 'px';
  container.style.fontSize = size + 'px';
  let cursor = { segmentIndex: 0, graphemeIndex: 0 };
  const placed = [];
  for (let y = 0; y + lh <= H; y += lh) {
    for (const run of runsInBand(img, y, y + lh)) {
      if (run.w < MIN_RUN * size) continue;
      const p = run.crust ? srcBold : src;
      let line = layoutNextLine(p, cursor, run.w);
      if (!line) { cursor = { segmentIndex: 0, graphemeIndex: 0 }; line = layoutNextLine(p, cursor, run.w); }
      cursor = line.end;
      const text = line.text.trim();
      if (!text) continue;
      const el = lineEl(text, lh);
      el.style.left = (left + run.x) + 'px';
      el.style.top = y + 'px';
      el.style.width = run.w + 'px';
      if (run.crust) el.classList.add('crust');
      if (el.childElementCount < 6) el.classList.add('narrow');
      container.appendChild(el);
      placed.push({ el, x: run.x, y: y + lh / 2 });
    }
  }
  // 페퍼로니: 글자 중심이 파랑 영역에 놓이면 빨갛게
  for (const { el, x, y } of placed) {
    for (const c of el.children) {
      const px = Math.round(x + c.offsetLeft + c.offsetWidth / 2), py = Math.round(y);
      if (px < 0 || px >= W) continue;
      if (img.data[(py * W + px) * 4 + 2] > 128) c.classList.add('pep');
    }
  }
}

function chars() { return [...container.querySelectorAll('.c')]; }

// 현재 글자들을 흩어지듯 지우고, 끝나면 next()를 실행
function fadeOut(next) {
  for (const c of chars()) {
    const delay = Math.random() * (SWAP.out - 150);
    c.style.transition = `transform 150ms ease-in ${delay}ms, opacity 150ms ease-in ${delay}ms`;
    c.style.transform = 'scale(0)';
    c.style.opacity = '0';
  }
  setTimeout(next, SWAP.out);
}

// 새 글자들을 화면 중심에서 바깥 순서로 튀어나오게
function growIn() {
  const cs = chars();
  const cx = innerWidth / 2, cy = innerHeight / 2;
  let maxDist = 1;
  const d = cs.map(c => {
    const r = c.getBoundingClientRect();
    const dist = Math.hypot(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy);
    if (dist > maxDist) maxDist = dist;
    return dist;
  });
  cs.forEach(c => { c.style.transition = 'none'; c.style.transform = 'scale(0)'; c.style.opacity = '0'; });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    cs.forEach((c, i) => {
      const delay = (d[i] / maxDist) * SWAP.grow;
      c.style.transition = `transform 250ms cubic-bezier(0.34, 1.56, 0.64, 1) ${delay}ms, opacity 150ms ease-out ${delay}ms`;
      c.style.transform = 'none';
      c.style.opacity = '1';
    });
  }));
}

fun.addEventListener('click', () => {
  on = !on;
  fun.setAttribute('aria-pressed', String(on));
  fadeOut(() => { (on ? renderPizza : renderLorem)(); growIn(); });
});

await Promise.all([document.fonts.load(FONT), document.fonts.load(FONT_BOLD)]);
lorem = LOREM.map(t => prepareWithSegments(t, FONT));
renderLorem();
let t;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(on ? renderPizza : renderLorem, 100); });
</script>
</body>
</html>
