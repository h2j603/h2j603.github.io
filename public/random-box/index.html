<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>random box</title>
<style>
@font-face {
  font-family: "Suisse Intl Condensed";
  src: url("fonts/SuisseIntlCond-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Suisse Intl Condensed";
  src: url("fonts/SuisseIntlCond-Bold.woff2") format("woff2");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
html { font-family: "Suisse Intl Condensed", sans-serif; -webkit-text-size-adjust: 100%; }
body { margin: 0; padding: 1rem; }
#text { font-size: 16px; }
#text .line { white-space: pre; }
#text .c { display: inline-block; will-change: transform, opacity; }

/* 피자 모드: 줄마다 원의 폭에 맞춰 잘라 가운데 정렬, 글자를 양끝으로 고르게 벌린다 */
#text.pizza .line { display: flex; justify-content: space-between; margin: 0 auto; }
#text.pizza .line.narrow { justify-content: center; }

/* 버튼: 화면 중앙 하단 고정 */
#fun {
  position: fixed;
  left: 50%;
  bottom: 1rem;
  translate: -50% 0;
  z-index: 100;
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  text-transform: uppercase;
  color: #000;
  background: lawngreen;
  border: 0;
  border-radius: 999px;
  padding: 0.6em 1.4em;
  margin: 0;
  cursor: pointer;
  box-shadow: 0 0 0 0 rgba(124, 252, 0, 0);
  transition: box-shadow 0.35s ease, transform 0.12s ease, filter 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
#fun:hover {
  box-shadow: 0 0 24px 6px rgba(124, 252, 0, 0.75), 0 0 64px 20px rgba(124, 252, 0, 0.35);
}
#fun:active {
  transform: scale(0.95);
  filter: brightness(0.9);
  box-shadow: 0 0 12px 2px rgba(124, 252, 0, 0.6);
}
#fun:focus-visible {
  outline: 2px solid #000;
  outline-offset: 3px;
}
#fun[aria-pressed="true"] {
  background: #000;
  color: lawngreen;
  box-shadow: 0 0 24px 6px rgba(124, 252, 0, 0.75);
}
</style>
</head>
<body>
<div id="text"></div>
<button id="fun" type="button" aria-pressed="false">fun mode!</button>

<script type="module">
import { prepareWithSegments, layoutWithLines, layoutNextLine } from './lib/pretext.js';

const FONT_SIZE = 16;
const LINE_HEIGHT = 22;
const FONT = `${FONT_SIZE}px "Suisse Intl Condensed"`;
const BUTTON_ZONE = 120;   // 피자 지름을 정할 때 버튼 자리로 비워둘 높이(px)
const MIN_CHORD = 100;     // 이보다 좁은 줄은 비운다(원 맨 위·아래)
const SWAP = { out: 350, grow: 700 };  // 전환 애니메이션(ms)

const LOREM = [
  'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.',
  'Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo. Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt. Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit, sed quia non numquam eius modi tempora incidunt ut labore et dolore magnam aliquam quaerat voluptatem.',
  'At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident, similique sunt in culpa qui officia deserunt mollitia animi, id est laborum et dolorum fuga. Et harum quidem rerum facilis est et expedita distinctio. Nam libero tempore, cum soluta nobis est eligendi optio cumque nihil impedit quo minus id quod maxime placeat facere possimus, omnis voluptas assumenda est, omnis dolor repellendus.',
];

const PIZZA = 'Pizza ipsum dolor amet. Pepperoni mozzarella marinara, thin crust hand-tossed and wood-fired. Extra cheese, garlic parmesan, ranch on the side. Meatball buffalo chicken, bacon ricotta, pineapple ham (yes, pineapple). Deep dish stuffed crust, sausage and onions, roasted red peppers, black olives, banana peppers. Fresh basil, burrata, San Marzano tomatoes, olive oil drizzle. Slice by the slice, whole pie, family size, large with everything. Pesto white pie, spinach mushroom, four cheese, buffalo mozzarella. Crispy edges, bubbly cheese, chewy crust, charred bottom. NY style fold, Detroit square, Neapolitan blister, Sicilian thick. Delivery in thirty minutes, dine in, carry out, late night slice. Anchovies for the brave, jalapenos for the bold, extra sauce for the wise. ';

const container = document.getElementById('text');
const fun = document.getElementById('fun');
let lorem = [];
let pizza = null;
let on = false;

function lineEl(text) {
  const el = document.createElement('div');
  el.className = 'line';
  el.style.height = LINE_HEIGHT + 'px';
  el.style.lineHeight = LINE_HEIGHT + 'px';
  for (const ch of text) {
    const s = document.createElement('span');
    s.className = 'c';
    s.textContent = ch;
    el.appendChild(s);
  }
  return el;
}

// 로렘 입숨: 왼끝맞춤 문단
function renderLorem() {
  const width = container.clientWidth;
  container.className = '';
  container.textContent = '';
  lorem.forEach((p, i) => {
    const { lines } = layoutWithLines(p, width, LINE_HEIGHT);
    for (const line of lines) container.appendChild(lineEl(line.text));
    if (i < lorem.length - 1) container.appendChild(lineEl(''));
  });
}

// 피자 입숨: 원 안을 줄 단위로 채운다. 줄의 폭 = 그 높이에서 원의 현(chord) 길이
function renderPizza() {
  const width = container.clientWidth;
  const D = Math.min(width, innerHeight - BUTTON_ZONE);
  const R = D / 2;
  container.className = 'pizza';
  container.textContent = '';
  const n = Math.floor(D / LINE_HEIGHT);
  const top = (D - n * LINE_HEIGHT) / 2;
  let cursor = { segmentIndex: 0, graphemeIndex: 0 };
  for (let i = 0; i < n; i++) {
    // 줄의 위·아래 가장자리 중 원 중심에서 먼 쪽 기준으로 현을 재야 글자가 원 밖으로 안 나간다
    const edge = Math.abs(top + i * LINE_HEIGHT + LINE_HEIGHT / 2 - R) + LINE_HEIGHT / 2;
    const chord = edge >= R ? 0 : 2 * Math.sqrt(R * R - edge * edge);
    if (chord < MIN_CHORD) { container.appendChild(lineEl('')); continue; }
    let line = layoutNextLine(pizza, cursor, chord);
    if (!line) { cursor = { segmentIndex: 0, graphemeIndex: 0 }; line = layoutNextLine(pizza, cursor, chord); }
    cursor = line.end;
    const el = lineEl(line.text.trim());
    el.style.width = chord + 'px';
    if (el.childElementCount < 3) el.classList.add('narrow');
    container.appendChild(el);
  }
}

function chars() { return [...container.querySelectorAll('.c')]; }

// 현재 글자들을 흩어지듯 지우고, 끝나면 next()를 실행
function fadeOut(next) {
  for (const c of chars()) {
    const delay = Math.random() * (SWAP.out - 150);
    c.style.transition = `transform 150ms ease-in ${delay}ms, opacity 150ms ease-in ${delay}ms`;
    c.style.transform = 'scale(0)';
    c.style.opacity = '0';
  }
  setTimeout(next, SWAP.out);
}

// 새 글자들을 화면 중심에서 바깥 순서로 튀어나오게
function growIn() {
  const cs = chars();
  const cx = innerWidth / 2, cy = innerHeight / 2;
  let maxDist = 1;
  const d = cs.map(c => {
    const r = c.getBoundingClientRect();
    const dist = Math.hypot(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy);
    if (dist > maxDist) maxDist = dist;
    return dist;
  });
  cs.forEach(c => { c.style.transition = 'none'; c.style.transform = 'scale(0)'; c.style.opacity = '0'; });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    cs.forEach((c, i) => {
      const delay = (d[i] / maxDist) * SWAP.grow;
      c.style.transition = `transform 250ms cubic-bezier(0.34, 1.56, 0.64, 1) ${delay}ms, opacity 150ms ease-out ${delay}ms`;
      c.style.transform = 'none';
      c.style.opacity = '1';
    });
  }));
}

fun.addEventListener('click', () => {
  on = !on;
  fun.setAttribute('aria-pressed', String(on));
  fadeOut(() => { (on ? renderPizza : renderLorem)(); growIn(); });
});

await document.fonts.load(FONT);
lorem = LOREM.map(t => prepareWithSegments(t, FONT));
pizza = prepareWithSegments(PIZZA.repeat(8), FONT);
renderLorem();
let t;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(on ? renderPizza : renderLorem, 100); });
</script>
</body>
</html>
